<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Document Similarity Matrix</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>

<div id="heatmap" style="width:1400px; height:900px;"></div>

<script>
fetch("PRC_DelegacionAllFilesSimilarityMatrix.json")
  .then(response => response.json())
  .then(data => {
    const trace = {
      type: "heatmap",
      z: data.z,
      x: data.x,
      y: data.y,
      colorscale: "Viridis"
    };

    const layout = {
      width: 1400,
      height: 900,
      margin: { l: 200, r: 40, t: 80, b: 200 },
      title: {
        text: "Document Similarity Matrix",
        x: 0,
        xanchor: "left"
      }
    };

    Plotly.newPlot("heatmap", [trace], layout);
  });
</script>

</body>
</html>
